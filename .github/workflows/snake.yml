name: Generate Profile Stats

on:
  # Refresh profile assets four times a day.
  schedule:
    - cron: "0 */6 * * *"
  
  # Allows manual trigger
  workflow_dispatch:
  
  # Run on every push to main
  push:
    branches:
      - main

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Test profile generators and links
        run: python -m unittest discover -s tests -v

      - name: Generate GitHub streak card
        run: python scripts/generate_streak.py --username "${{ github.repository_owner }}" --output dist/github-streak.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.svg?palette=github-light

      - name: Upload profile assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: profile-assets
          path: |
            dist/github-streak.svg
            dist/github-contribution-grid-snake-dark.svg
            dist/github-contribution-grid-snake.svg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout output branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: output
          path: output

      - name: Download profile assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: profile-assets
          path: output

      - name: Publish profile assets
        working-directory: output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- github-streak.svg github-contribution-grid-snake-dark.svg github-contribution-grid-snake.svg
          if git diff --cached --quiet; then
            echo "Profile assets are already current."
            exit 0
          fi
          git commit -m "Update generated profile assets"
          git push origin HEAD:output
